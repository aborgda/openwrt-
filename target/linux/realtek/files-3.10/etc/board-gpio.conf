# RTL8198C GPIO/DTS board map derived from the supplied BSP source.
# H7 = WPS LED, H5 = reset button, H6 = WPS button.
# E7 is the alternate reset pin for CONFIG_RTL_8198C_8367RB.
GN866_AC_WPS_LED_GPIO=H7
GN866_AC_RESET_GPIO=H5
GN866_AC_WPS_GPIO=H6
SK337_WPS_LED_GPIO=H7
SK337_RESET_GPIO=H5
SK337_WPS_GPIO=H6
RTL8198C_8367RB_RESET_GPIO=E7
