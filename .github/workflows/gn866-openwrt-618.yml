name: GN866 OpenWrt 6.18

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "target/linux/realtek/**"
      - "package/kernel/rtl819x/**"
      - ".github/workflows/gn866-openwrt-618.yml"

concurrency:
  group: gn866-openwrt-618-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenWrt build tools
        shell: bash
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends             build-essential gcc-10 g++-10 make clang flex bison gawk gettext git             libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils             rsync unzip zlib1g-dev file wget curl ca-certificates swig time xsltproc             libelf-dev cpio rename patch perl
          ln -sf /usr/bin/gcc-10 /usr/local/bin/gcc
          ln -sf /usr/bin/g++-10 /usr/local/bin/g++
          gcc --version
          g++ --version
          printf 'int main(void){return 0;}\n' | gcc -x c - -o /tmp/cc-test
          printf '#include <ncurses.h>\nint main(void){return 0;}\n' | gcc -x c - -lncurses -o /tmp/nc-test

      - name: Update feeds
        shell: bash
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure GN866 RTL8198C
        shell: bash
        run: |
          set -eux
          cat > .config <<'EOF'
          CONFIG_TARGET_realtek=y
          CONFIG_TARGET_realtek_rtl8198c=y
          CONFIG_TARGET_ARCH_PACKAGES="mips_24kc"
          CONFIG_PACKAGE_kmod-rtl8192enb=y
          CONFIG_PACKAGE_kmod-rtl8192er=y
          CONFIG_PACKAGE_kmod-rtl8822be=y
          CONFIG_PACKAGE_kmod-rtl8822b=y
          CONFIG_PACKAGE_kmod-rtw88=y
          CONFIG_PACKAGE_kmod-rtw88-pci=y
          CONFIG_PACKAGE_kmod-rtw88-8822b=y
          CONFIG_PACKAGE_kmod-rtw88-8822be=y
          CONFIG_PACKAGE_linux-firmware=y
          CONFIG_PACKAGE_wpad-basic-mbedtls=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_luci=y
          EOF
          # The local target.mk/image Makefile registers the GN866 device.
          # FORCE bypasses OpenWrt's over-strict prerequisite probe in the
          # Ubuntu 20.04 container; the compiler was explicitly smoke-tested above.
          make FORCE=1 defconfig
          grep -E 'CONFIG_TARGET_realtek|CONFIG_PACKAGE_kmod-(rtl8192|rtl8822|rtw88)|CONFIG_KERNEL_PATCHVER' .config || true

      - name: Build GN866 firmware
        shell: bash
        env:
          FORCE_UNSAFE_CONFIGURE: "1"
        run: |
          set -o pipefail
          mkdir -p artifacts
          # Linux 6.18 can ask Kconfig questions when the target config is
          # older/incomplete. Feed empty answers so every new symbol takes
          # its default instead of stopping the unattended firmware build.
          set +o pipefail
          yes '' | make -j2 V=sc FORCE=1 world 2>&1 | tee artifacts/build.log
          rc=${PIPESTATUS[1]}
          set -o pipefail
          exit "$rc"

      - name: Verify output
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          find bin/targets bin/packages -type f \( -name '*.bin' -o -name '*.img' -o -name '*.itb' -o -name '*.gz' -o -name '*.ipk' \) -size +1k -print 2>/dev/null | tee artifacts/files.txt || true
          cp -a bin/targets artifacts/targets 2>/dev/null || true
          cp -a bin/packages artifacts/packages 2>/dev/null || true
          cp -f .config artifacts/gn866-openwrt-6.18.config 2>/dev/null || true
          ls -lah artifacts

      - name: Upload GN866 OpenWrt 6.18 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GN866-OpenWrt-6.18
          path: artifacts/
          if-no-files-found: warn
