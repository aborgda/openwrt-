name: GN866 OpenWrt 6.18

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "target/linux/realtek/**"
      - "package/kernel/rtl819x/**"
      - "package/kernel/mac80211/realtek.mk"
      - ".github/workflows/gn866-openwrt-618.yml"

concurrency:
  group: gn866-openwrt-618-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenWrt build tools
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y             build-essential clang flex bison g++ gawk gettext git libncurses5-dev             libncursesw5-dev libssl-dev python3 python3-distutils rsync unzip             zlib1g-dev file wget curl ca-certificates swig time xsltproc             libelf-dev cpio rename

      - name: Update feeds
        shell: bash
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure GN866 RTL8198C
        shell: bash
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_realtek=y
          CONFIG_TARGET_realtek_rtl8198c=y
          CONFIG_TARGET_DEVICE_realtek_rtl8198c_DEVICE_gn866_ac=y
          CONFIG_TARGET_ARCH_PACKAGES="mips_24kc"
          CONFIG_PACKAGE_kmod-rtl8192enb=y
          CONFIG_PACKAGE_kmod-rtl8192er=y
          CONFIG_PACKAGE_kmod-rtl8822be=y
          CONFIG_PACKAGE_kmod-rtl8822b=y
          CONFIG_PACKAGE_kmod-rtw88=y
          CONFIG_PACKAGE_kmod-rtw88-pci=y
          CONFIG_PACKAGE_kmod-rtw88-8822b=y
          CONFIG_PACKAGE_kmod-rtw88-8822be=y
          CONFIG_PACKAGE_linux-firmware=y
          CONFIG_PACKAGE_wpad-basic-mbedtls=y
          CONFIG_PACKAGE_uhttpd=y
          EOF
          make defconfig
          grep -E 'CONFIG_TARGET_realtek|CONFIG_PACKAGE_kmod-(rtl8192|rtl8822|rtw88)|CONFIG_KERNEL_PATCHVER' .config || true
          make -s target/linux/prepare V=s
          
      - name: Build GN866 firmware
        shell: bash
        env:
          FORCE_UNSAFE_CONFIGURE: "1"
        run: |
          set -o pipefail
          mkdir -p artifacts
          make -j2 V=sc world 2>&1 | tee artifacts/build.log

      - name: Verify output
        if: always()
        shell: bash
        run: |
          find bin/targets bin/packages -type f \( -name '*.bin' -o -name '*.img' -o -name '*.itb' -o -name '*.gz' -o -name '*.ipk' \) -size +1k -print 2>/dev/null | tee artifacts/files.txt || true
          cp -a bin/targets artifacts/targets 2>/dev/null || true
          cp -a bin/packages artifacts/packages 2>/dev/null || true
          cp -f .config artifacts/gn866-openwrt-6.18.config 2>/dev/null || true
          ls -lah artifacts
          
      - name: Upload GN866 OpenWrt 6.18 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GN866-OpenWrt-6.18
          path: artifacts/
          if-no-files-found: warn
