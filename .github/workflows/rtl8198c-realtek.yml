name: RTL8198C Realtek target build

on:
  push:
    branches: [rtl8198c-gn866-sk337]
    paths:
      - 'target/linux/realtek/**'
      - '.github/workflows/rtl8198c-realtek.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout configured OpenWrt tree
        uses: actions/checkout@v4

      - name: Checkout legacy Realtek OpenWrt SDK
        uses: actions/checkout@v4
        with:
          repository: aborgda/openwrt-rtk819
          path: legacy
          fetch-depth: 1

      - name: Prepare legacy RTL8198C build workspace
        shell: bash
        run: |
          set -eux
          rm -rf build-rtk
          cp -a legacy/. build-rtk/
          # Keep the proven legacy rtkmips target; target/linux/realtek is
          # the maintained source tree for our RTL8198C additions.
          cp -a target/linux/realtek/files-3.10/. build-rtk/target/linux/rtkmips/files/
          mkdir -p build-rtk/target/linux/rtkmips/image
          cp target/linux/realtek/image/Makefile.legacy build-rtk/target/linux/rtkmips/image/Makefile
          mkdir -p build-rtk/target/linux/rtkmips/rtl8198c
          cp target/linux/realtek/rtl8198c/target.mk build-rtk/target/linux/rtkmips/rtl8198c/target.mk
          cp target/linux/realtek/rtl8198c/files/dev_leds_gpio.c build-rtk/target/linux/rtkmips/files/arch/rlx/soc-rtl819xd/dev_leds_gpio.c
          cp target/linux/realtek/rtl8198c/files/gpio.c build-rtk/target/linux/rtkmips/files/arch/rlx/soc-rtl819xd/gpio.c
          cp target/linux/realtek/rtl8198c/files/mach_rtl8198c.c build-rtk/target/linux/rtkmips/files/arch/rlx/soc-rtl819xd/mach_rtl8198c.c
          cp target/linux/realtek/rtl8198c/files/rtl8198c.c build-rtk/target/linux/rtkmips/files/arch/rlx/soc-rtl819xd/prom.c
          cp target/linux/realtek/rtl8198c/files/Makefile build-rtk/target/linux/rtkmips/files/arch/rlx/soc-rtl819xd/Makefile
          chmod +x build-rtk/target/linux/rtkmips/files/etc/init.d/rtl8198c-wlan
          cp legacy/rtk_deconfig/defconfig_rtl8198c build-rtk/.config
          {
            echo 'CONFIG_TARGET_rtkmips=y'
            echo 'CONFIG_TARGET_rtkmips_rtl8198c=y'
            echo 'CONFIG_TARGET_ROOTFS_SQUASHFS=y'
            echo 'CONFIG_TARGET_SQUASHFS_BLOCK_SIZE=4'
          } >> build-rtk/.config

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zlib1g-dev gawk flex bison gettext rsync unzip wget python3

      - name: Build GN866 and SK337
        working-directory: build-rtk
        shell: bash
        run: |
          set -eux
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a || true
          make defconfig
          make -j2 V=s
          find bin -type f -name '*fw.bin' -o -name '*factory.bin' | sort

      - name: Collect firmware
        shell: bash
        run: |
          mkdir -p artifacts
          find build-rtk/bin -type f \( -name '*fw.bin' -o -name '*factory.bin' -o -name '*linux.bin' \) -exec cp -v {} artifacts/ \; || true
          printf '%s\n' 'RTL8198C legacy rtkmips build' 'GN866 AC + SK337' 'GPIO/LED/button board sources imported' 'WLAN auto-start enabled' > artifacts/README.txt
          ls -lh artifacts

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RTL8198C-GN866-SK337
          path: artifacts/
