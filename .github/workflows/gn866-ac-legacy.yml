name: GN866 AC legacy vendor build

on:
  workflow_dispatch:
  push:
    branches: [main, rtl8198c-gn866-sk337]
    paths:
      - "targets/gn866-ac/**"
      - "target/linux/realtek/**"
      - "package/kernel/rtl819x/**"
      - ".github/workflows/gn866-ac-legacy.yml"

concurrency:
  group: gn866-ac-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install legacy SDK dependencies
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y build-essential gcc g++ make git python3 file bison flex gettext rsync unzip zip xz-utils bzip2 gzip cpio patch wget curl libncurses5-dev libncurses-dev gcc-multilib g++-multilib libc6-dev-i386 libc6-i386 lib32z1 lib32stdc++6 zlib1g-dev zlib1g:i386

      - name: Build GN866 AC
        shell: bash
        env:
          FORCE_UNSAFE_CONFIGURE: "1"
        run: |
          chmod +x targets/gn866-ac/build.sh
          targets/gn866-ac/build.sh

      - name: Verify CR6C factory image
        shell: bash
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p = Path("sdk/boards/rtl8198/image/GN866_factory.bin")
          d = p.read_bytes()
          assert d[:4] == b"cr6c", d[:4]
          off = 0
          blocks = []
          while off + 16 <= len(d):
              sig, start, burn, length = struct.unpack_from(">4sIII", d, off)
              off += 16
              payload = d[off:off + length]
              assert len(payload) == length
              assert sig in (b"cr6c", b"cs6c", b"r6cr", b"w6cg", b"w6ca"), sig
              assert len(payload) % 2 == 0
              checksum = sum(struct.unpack_from(">H", payload, n)[0] for n in range(0, len(payload), 2)) & 0xffff
              assert checksum == 0, (sig, hex(checksum))
              blocks.append((sig.decode(), hex(start), hex(burn), length))
              off += length
          assert off == len(d)
          assert blocks and blocks[0][0] == "cr6c"
          assert any(x[0] == "r6cr" for x in blocks)
          print("GN866 CR6C image verified:", p)
          print(*blocks, sep="\n")
          PY

      - name: Collect GN866 artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          cp -f sdk/boards/rtl8198/image/GN866_factory.bin artifacts/ 2>/dev/null || true
          cp -f sdk/boards/rtl8198/image/fw.bin artifacts/GN866-sdk-fw.bin 2>/dev/null || true
          cp -f sdk/boards/rtl8198/image/linux.bin artifacts/ 2>/dev/null || true
          cp -f sdk/boards/rtl8198/image/root.bin artifacts/ 2>/dev/null || true
          cp -f sdk/boards/rtl8198/image/webpages.bin artifacts/ 2>/dev/null || true
          cp -f sdk/.config artifacts/sdk.config 2>/dev/null || true
          printf '%s\n' 'GN866 AC RTL8198C legacy vendor build' 'CR6C image generated by SDK cvimg (linux-ro) and packaged by SDK mgbin cascade.' 'WLAN startup added for rtl8192e and wlan0/wlan1.' 'This artifact is not a substitute for dump-derived GPIO/calibration data.' > artifacts/README.txt
          ls -lh artifacts

      - name: Upload GN866 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GN866-AC-legacy
          path: artifacts/
          if-no-files-found: warn
